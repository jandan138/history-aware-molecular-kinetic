name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src scripts tests
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_render_configs.py
      - run: python scripts/create_render_manifest.py --config configs/render/shared-comparison.yml --artifacts schemas/examples/render-artifacts.json --output build/render-manifest-smoke
      - run: make render-audit-smoke
      - run: python scripts/check_repo.py

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
