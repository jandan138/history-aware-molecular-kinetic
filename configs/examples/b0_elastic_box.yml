schema_version: "1.0.0"
case_id: B0-EDMD-ELASTIC-BOX-v0
suite: B0
title: Elastic hard disks in a periodic box
status: candidate
physics:
  dimension: 2
  model: elastic_hard_sphere
  domain:
    lower: [0.0, 0.0]
    upper: [1.0, 1.0]
    boundary: periodic
  species:
    - name: gas
      diameter: 0.01
      mass: 1.0
  packing_fraction: 0.02
initial_condition:
  kind: maxwellian
  temperature: 1.0
  mean_velocity: [0.0, 0.0]
methods:
  - exact_edmd_reference
sampling:
  end_time: 10.0
  interval: 0.1
  seeds: [0, 1, 2]
outputs:
  - particle_bundle
  - collision_log
  - metrics_report
acceptance:
  - metric: relative_energy_drift
    operator: less_equal
    value: 1.0e-10
