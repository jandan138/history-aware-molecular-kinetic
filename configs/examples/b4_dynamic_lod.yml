schema_version: "1.0.0"
case_id: B4-DYNAMIC-LOD-SMOKE-v0
suite: B4
title: Dynamic exact/kinetic partition smoke test
status: candidate
physics:
  dimension: 2
  model: elastic_hard_sphere
  domain:
    lower: [0.0, 0.0]
    upper: [4.0, 2.0]
    boundary: reflective_geometry
  species:
    - name: gas
      diameter: 0.02
      mass: 1.0
  packing_fraction: 0.03
initial_condition:
  kind: transient_expansion
  temperature: 1.0
  mean_velocity: [0.0, 0.0]
methods:
  - state_only_partition
  - history_aware_partition
  - full_exact_reference
sampling:
  end_time: 20.0
  interval: 0.05
  seeds: [0, 1, 2, 3]
outputs:
  - partition_mask
  - conversion_report
  - block_state_bundle
  - metrics_report
acceptance:
  - metric: exact_region_fraction_mean
    operator: between
    value: [0.05, 0.30]
