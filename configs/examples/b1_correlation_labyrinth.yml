schema_version: "1.0.0"
case_id: B1-CORRELATION-LABYRINTH-v0
suite: B1
title: Geometry-conditioned collision-history discrepancy
status: candidate
physics:
  dimension: 2
  model: elastic_hard_sphere
  domain:
    lower: [0.0, 0.0]
    upper: [4.0, 2.0]
    boundary: reflective_geometry
  species:
    - name: gas
      diameter: 0.02
      mass: 1.0
  packing_fraction: 0.04
initial_condition:
  kind: matched_two_region_ensemble
  temperature: 1.0
  mean_velocity: [0.8, 0.0]
methods:
  - exact_edmd_reference
  - boltzmann_dsmc_baseline
sampling:
  end_time: 20.0
  interval: 0.05
  seeds: [0, 1, 2, 3, 4, 5, 6, 7]
outputs:
  - block_state_bundle
  - collision_log
  - discrepancy_dataset
  - metrics_report
acceptance:
  - metric: exact_kinetic_dataset_coverage
    operator: greater_equal
    value: 0.95
