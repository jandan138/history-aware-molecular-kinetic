  - id: deng_hani_ma_hard_spheres_2024
    kind: paper
    title: Long time derivation of the Boltzmann equation from hard sphere dynamics
    authors: [Yu Deng, Zaher Hani, Xiao Ma]
    year: 2024
    url: https://arxiv.org/abs/2408.07818
    role: theorem_context
    supports:
      - long-time hard-sphere-to-Boltzmann derivation under stated assumptions
      - cumulant and collision-history-molecule proof framework
