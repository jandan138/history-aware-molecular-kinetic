  - render_manifest
  - image_sequence
  - particle_bundle
  - kinetic_bundle
  - partition_mask
  - metrics_report
acceptance:
  - metric: physics_artifact_hash_locked
    operator: equal
    value: 1
  - metric: reference_applicability_report_present
    operator: equal
    value: 1
  - metric: camera_physics_coupling_events
    operator: equal
    value: 0
  - metric: method_specific_render_override_count
    operator: equal
    value: 0
  - metric: comparison_lock_match
    operator: equal
    value: 1
  - metric: artifact_hash_coverage
    operator: equal
    value: 1.0
  - metric: display_density_relative_mismatch
    operator: less_equal
    value: 0.02
