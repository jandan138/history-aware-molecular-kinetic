site_name: History-Aware Molecular–Kinetic
site_description: Benchmark-first collision-history-aware molecular–kinetic simulation research
repo_url: https://github.com/jandan138/history-aware-molecular-kinetic

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Learning:
      - From GAMES103 to Molecular–Kinetic Simulation: learning/from-games103-to-history-aware-molecular-kinetic.md
  - Vision:
      - Research thesis: vision/research-thesis.md
      - Scope and non-goals: vision/scope-and-non-goals.md
      - Paper positioning: vision/paper-positioning.md
  - Research:
      - 中文研究总览: research/zh-research-overview.md
      - Hard-sphere to kinetic primer: research/hard-sphere-kinetic-primer.md
      - Collision-History Echoes: research/collision-history-echo-route.md
      - Deng–Hani–Ma connection: research/deng-hard-sphere-connection.md
      - Hypotheses: research/hypotheses.md
      - Related work: research/related-work.md
      - Novelty map: research/novelty-map.md
      - Feasibility assessment: research/feasibility-assessment.md
      - Scientific risks: research/scientific-risks.md
      - Source ledger: research/source-ledger.md
  - Architecture:
